# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: assay-indexer
description: Assay receipts, anchors, co-signatures and verifier grades on Monad mainnet and testnet
disable_default_cross_chain: true
# Lowercase addresses keep ids and GraphQL filters case-stable.
address_format: lowercase
contracts:
  - name: ReceiptAnchor
    events:
      - event: HostKeySet(uint256 indexed agentId, bytes32 indexed keyHash, bytes32 qx, bytes32 qy)
      - event: Anchored(uint256 indexed agentId, bytes32 indexed root, uint32 count, bytes32 keyHash)
      - event: Cosigned(bytes32 indexed receiptHash, bytes32 indexed requesterKey, uint256 indexed agentId, bytes32 root)
      - event: CosignedK(bytes32 indexed receiptHash, address indexed signer, uint256 indexed agentId, bytes32 root)
  - name: VerifierRegistry
    events:
      - event: VerifierRegistered(address indexed verifier, uint256 indexed agentId)
      - event: GradePosted(address indexed verifier, uint256 indexed verifierAgentId, bytes32 indexed model, bytes32 hostKey, uint32 passed, uint32 total, uint16 ciLowBps, uint16 ciHighBps, bytes32 checks, bytes32 refModel, bytes32 evidence, uint64 t)
  - name: CreAttestor
    events:
      - event: GradeAttested(address indexed verifier, bytes32 indexed model, bytes32 indexed hostKey, uint64 t, bool agree, uint32 passed, uint32 total)
  - name: IdentityRegistry
    events:
      - event: Registered(uint256 indexed agentId, string agentURI, address indexed owner)
  - name: ReputationRegistry
    events:
      - event: NewFeedback(uint256 indexed agentId, address indexed clientAddress, uint64 feedbackIndex, int128 value, uint8 valueDecimals, string indexed indexedTag1, string tag1, string tag2, string endpoint, string feedbackURI, bytes32 feedbackHash)
      - event: FeedbackRevoked(uint256 indexed agentId, address indexed clientAddress, uint64 indexed feedbackIndex)
      - event: ResponseAppended(uint256 indexed agentId, address indexed clientAddress, uint64 feedbackIndex, address indexed responder, string responseURI, bytes32 responseHash)
